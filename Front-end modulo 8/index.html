<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Usuário</h1>
    <p class="subtitle">Os dados são salvos automaticamente no navegador e o endereço é preenchido a partir do CEP.</p>

    <form id="form-cadastro" autocomplete="off">
      <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com">
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="field">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9">
          <span id="cep-status" class="status"></span>
        </div>

        <div class="field">
          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" name="logradouro" placeholder="Rua, Av...">
        </div>

        <div class="row">
          <div class="field">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" placeholder="Nº">
          </div>

          <div class="field">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco...">
          </div>
        </div>

        <div class="field">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" placeholder="Bairro">
        </div>

        <div class="row">
          <div class="field">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade">
          </div>

          <div class="field">
            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" placeholder="UF" maxlength="2">
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit">Salvar cadastro</button>
        <button type="button" id="btn-limpar" class="secondary">Limpar dados</button>
      </div>
    </form>

    <p id="mensagem" class="mensagem"></p>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
